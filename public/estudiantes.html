<!DOCTYPE html>
<html>
<head>
  <title>Sistema de Tiquetes para Estudiantes</title>
  <link rel="stylesheet" href="student.css">
</head>
<body>
    <img src="imagen/pixelcut-export.png" alt="">
  <h1>Sistema de Tickets para Uso de Equipo</h1>

  <div id="ticket">
    <h2>Solicitar Asistencia</h2>
    <label for="estudiante">Nombre del Estudiante:</label>
    <input type="text" id="estudiante" required><br><br>

    <label for="consulta">Consulta:</label>
    <textarea id="consulta" required></textarea><br><br>

    <button id="solicitar">Solicitar Ticket</button>
  </div>

  <div id="consultas">
    <h2>Registro de Consultas</h2>
    <img src="imagen/descargafwd.png" alt="">
    <div id="registro">
    </div>
  </div>

</body>
</html>
