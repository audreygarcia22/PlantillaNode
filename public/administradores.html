<!DOCTYPE html>
<html>
<head>
    <title>Administrador - Sistema de Tickets</title>
    <link rel="stylesheet" href="administ.css">
</head>
<body>
    <h1>Sistema de Tickets para Estudiantes</h1>
    <p id="nombreAdministrador">Administrador:</p>

    <div id="ticket">
        <div id="cola">
            <h4>Cola de Tickets</h4>
            <ul id="listaCola"></ul>
        </div>

        <h2>Solicitud de Asistencia</h2>
        
        <label>Nombre del Estudiante:</label><br>
        <span id="estudiante"></span><br><br>

        <label>Consulta:</label><br>
        <span id="consulta"></span><br><br>

        <label>Tipo de Urgencia:</label><br>
        <span id="urgencia"></span><br><br>
        
        <label>Fecha y Hora de Solicitud:</label><br>
        <span id="fechaSolicitud"></span><br><br>

        <label>Respuesta:</label><br>
        <textarea id="respuesta" required></textarea><br><br>

        <button id="asistencia">Enviar</button>
    </div>

    <script type="module" src="administrator.js"></script>
</body>
</html>
