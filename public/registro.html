<!DOCTYPE html>
<html>

<head>
  <title>Registro de Estudiantes</title>
  <link rel="stylesheet" href="registro.css">
</head>

<body>
  <h1>Formulario de Registro</h1>

  <form>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required><br><br>

    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido" name="apellido" required><br><br>

    <label for="ident">Número de identificación:</label>
    <input type="number" id="cedula" name="cedula" required><br><br>

    <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required><br><br>

    <label for="email">Correo Electrónico:</label>
    <input type="email" id="email" name="email" required><br><br>

    <label for="telefono">Teléfono:</label>
    <input type="number" id="telefono" name="telefono" required><br><br>

    <label for="direccion">Dirección:</label>
    <textarea id="direccion" name="direccion" required></textarea><br><br>

    <label for="contrasena">Contraseña:</label>
    <input type="password" id="contrasena" name="contrasena" required><br><br>

    <input type="submit" value="Registrar">
  </form>
</body>

</html>
