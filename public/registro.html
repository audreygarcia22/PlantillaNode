<!DOCTYPE html>
<html>

<head>
  <title>Registro de Estudiantes</title>
  <link rel="stylesheet" href="registro.css">
</head>

<body>
  <h1>Sistema de Tickets para Uso de Equipo</h1>
  <h3>Formulario de Registro</h3>

  <div id="tabla">
    <p>Tipo</p>
    <select name="" id="tipo">
      <option value="Administrador">Administrador</option>
      <option value="Estudiante">Estudiante</option>
    </select>

    <label id="nombre">Nombre:</label>
    <input type="text" id="name" name="nombre" required><br><br>

    <label id="apellido">Apellido:</label>
    <input type="text" id="lastName" name="apellido" required><br><br>

    <label id="ident">Número de identificación:</label>
    <input type="number" id="cedula" name="cedula" required><br><br>

    <label id="emai">Correo Electrónico:</label>
    <input type="em" id="email" name="email" required><br><br>

    <label id="contrasena">Contraseña:</label>
    <input type="pass" id="password" name="contrasena" required><br><br>

    <button id="sumit"><a href="login.html">Regístrate</a></button>
  </div>
</body>
<script type="module" src="record.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


</html>
